:root{

  --r:14px;
  font-size:100%;
}

  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211D; --ink:#E7EDE9; --muted:#9DABA4; --line:#2D3933;
  --accent:#5CC3A2; --accent-ink:#0C1813; --accent-soft:#1D3A30; --warm:#E3A55A; --warm-soft:#3A2C18; --focus:#E3A55A;
  color-scheme:dark}
:root.big{font-size:115%}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.125rem;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:34rem;margin:0 auto;padding-inline:16px;padding-block:0 2.5rem;min-height:100%;display:flex;flex-direction:column}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:.75rem .5rem;display:flex;align-items:center;gap:.75rem}
.iconbtn{flex:none;min-width:2.75rem;height:2.75rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;display:grid;place-items:center;cursor:pointer;font-size:1rem;padding:0 .7rem}
.iconbtn[disabled]{visibility:hidden}
.bar{flex:1;height:.5rem;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--warm);border-radius:999px;transition:width .35s ease}
.meta{display:flex;justify-content:space-between;gap:1rem;font-size:.875rem;color:var(--muted);min-height:1.4rem}

/* pantalla */
.screen{flex:1;display:flex;flex-direction:column;gap:1.25rem;padding-top:.75rem}
.screen.enter{animation:in .28s ease both}
@keyframes in{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:.8125rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0}
h1,h2{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.9rem,7.5vw,2.6rem)}
h2{font-size:clamp(1.5rem,5.6vw,1.95rem)}
h2:focus{outline:none}
.hint{margin:-.5rem 0 0;color:var(--muted);font-size:1rem}
.person{display:flex;align-items:center;gap:1rem;padding:1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.avatar{flex:none;width:3.5rem;height:3.5rem;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.person strong{font-family:var(--f-display);font-size:1.5rem;line-height:1.15}
.person small{display:block;color:var(--muted);font-size:.875rem}

/* opciones */
.opts{display:flex;flex-direction:column;gap:.625rem;margin:0;padding:0;list-style:none}
.opt{width:100%;min-height:3.5rem;text-align:left;display:flex;align-items:center;gap:.875rem;padding:.8rem 1rem;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer;font-size:1.0625rem;line-height:1.3;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:scale(.985)}
.opt .dot{flex:none;width:1.375rem;height:1.375rem;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .dot{border-color:var(--accent);background:var(--accent)}
.opt[aria-pressed="true"] .dot::after{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--accent-ink)}
.opt.quiet{border-style:dashed;background:transparent;min-height:3rem;color:var(--muted)}
.opt.quiet[aria-pressed="true"]{color:var(--ink);background:var(--accent-soft)}
.sep{height:.25rem}

.field{display:flex;flex-direction:column;gap:.4rem}
.field label{font-weight:700;font-size:1rem}
.input{width:100%;min-height:3.25rem;padding:.7rem 1rem;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.primary{min-height:3.5rem;width:100%;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.125rem;cursor:pointer;padding:.75rem 1rem}
.primary[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:.5rem 0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:1rem;align-self:flex-start}

/* buscador de localidad */
.combo{position:relative}
.results{list-style:none;margin:.5rem 0 0;padding:0;display:flex;flex-direction:column;gap:.375rem}
.results li{padding:.75rem 1rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
.results li small{color:var(--muted);font-size:.8125rem;text-align:right}
.results li[aria-selected="true"],.results li:hover{border-color:var(--accent);background:var(--accent-soft)}
.results .empty{cursor:default;color:var(--muted);border-style:dashed;background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.5rem .875rem;cursor:pointer;font-size:.9375rem;min-height:2.5rem}
.chip:hover{border-color:var(--accent)}

/* portada */
.hero{gap:1.1rem}
.ridge{display:block;width:100%;height:auto;max-width:100%;color:var(--accent);margin-top:.25rem}
.brand{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-top:1rem;font-size:.875rem;color:var(--muted)}
.promise{display:flex;flex-wrap:wrap;gap:.5rem;margin:0;padding:0;list-style:none}
.promise li{font-size:.875rem;padding:.3rem .7rem;border-radius:999px;background:var(--warm-soft);color:var(--ink)}
.tap{margin:0;color:var(--muted);font-size:.9375rem}
.privacy{font-size:.875rem;color:var(--muted);border-top:1px solid var(--line);padding-top:1rem;margin-top:auto}
.privacy summary{cursor:pointer;color:var(--ink)}
.privacy p{margin:.5rem 0 0}
.resume{border:1px solid var(--warm);background:var(--warm-soft);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.75rem}
.resume p{margin:0}
.resume .row{display:flex;gap:.75rem;flex-wrap:wrap}
.resume .primary{width:auto;flex:1;min-width:10rem}
.preview{font-size:.8125rem;border:1px dashed var(--warm);color:var(--ink);background:var(--warm-soft);border-radius:10px;padding:.5rem .75rem;margin-top:.75rem}

/* aviso de hito */
.toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,1rem);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:.75rem 1.1rem;border-radius:999px;font-weight:700;font-size:1rem;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* final */
.done h1{font-size:clamp(2rem,8vw,2.6rem)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:1.1rem;display:flex;flex-direction:column;gap:.9rem}
.card h3{margin:0;font-family:var(--f-display);font-size:1.2rem}
.card .sub{margin:-.5rem 0 0;color:var(--muted);font-size:.875rem}
.rbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem .75rem;align-items:baseline;font-size:1rem}
.rbar .track{grid-column:1/-1;height:.75rem;background:var(--line);border-radius:999px;overflow:hidden}
.rbar .track i{display:block;height:100%;background:var(--accent);border-radius:999px;width:0;transition:width .8s ease}
.rbar.mine .track i{background:var(--warm)}
.rbar b{font-variant-numeric:tabular-nums}
.rbar .you{display:inline-block;white-space:nowrap;font-size:.75rem;font-weight:700;color:var(--warm);text-transform:uppercase;letter-spacing:.06em;margin-left:.4rem}

.wa{display:flex;align-items:center;justify-content:center;gap:.6rem;min-height:3.5rem;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;font-size:1.0625rem}
.ghost{min-height:3.25rem;border-radius:var(--r);border:2px solid var(--line);background:transparent;cursor:pointer;font-weight:700}
.note{font-size:.8125rem;color:var(--muted);margin:0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

.ico{flex:none;width:2.5rem;height:2.5rem;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;transition:background .15s,color .15s}

.opt[aria-pressed="true"] .ico{background:var(--accent);color:var(--accent-ink)}
.av{flex:none;width:2.75rem;height:2.75rem;border-radius:50%;object-fit:cover;background:var(--line);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.opt[aria-pressed="true"] .av{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.person{flex-direction:column;justify-content:center;text-align:center;gap:.75rem;margin:0;padding:1.25rem 1rem}
.portrait{width:8rem;height:8rem;max-width:100%;border-radius:50%;object-fit:cover;background:var(--line);box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--line)}
.person figcaption{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.15}
.who{display:flex;gap:1rem;align-items:center;margin-top:-.25rem}
.who figure{margin:0;display:flex;align-items:center;gap:.6rem}
.who img{width:3.5rem;height:3.5rem;border-radius:50%;object-fit:cover;background:var(--line);box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}
.who figcaption{font-weight:700;font-size:.9375rem;line-height:1.2}
.who.pair{flex-wrap:wrap}
.place{display:flex;gap:1rem;align-items:center;padding:1rem;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.map{flex:none;width:3.6rem;color:var(--accent)}

.map path{fill:var(--accent-soft);stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.place-txt{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.place-txt p{margin:0}
.place-sub{font-size:1rem;color:var(--muted)}
/* sorteo */
.sorteo{border-color:var(--warm);background:var(--warm-soft)}
.sorteo .aviso{margin:0;font-size:.9375rem;padding:.6rem .8rem;border-radius:10px;background:var(--surface);border:1px solid var(--line)}

.check input{width:1.25rem;height:1.25rem;margin:.15rem 0 0;accent-color:var(--accent);flex:none}
.check a{color:var(--accent)}
.err{margin:0;min-height:1.2em;font-size:.9375rem;color:var(--warm);font-weight:700}
.err:empty{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var SCREENS=[];
function buildScreens(){
  SCREENS=[];
  PREGUNTAS.forEach(function(q,qi){
    if(q.cards){
      var ord=S.orders[q.id];
      ord.forEach(function(key,ci){
        var c=q.cards.filter(function(x){return x[0]===key;})[0];
        SCREENS.push({q:q, qn:qi+1, key:q.id+"_"+key, card:c, ci:ci, cn:ord.length});
      });
    } else SCREENS.push({q:q, qn:qi+1, key:q.id});
  });
}

/* ---------- medición del funnel ---------- */
function track(etapa, extra){
  if(S.eventos[etapa]) return; S.eventos[etapa]=1; save();
  try{ if(window.fbq){ var map={inicio:"InitiateCheckout",fin:"CompleteRegistration"}; if(map[etapa]) fbq("track",map[etapa]); else fbq("trackCustom","Encuesta_"+etapa); } }catch(e){}
  try{ if(window.gtag) gtag("event","encuesta_"+etapa,{pantalla:S.idx}); }catch(e){}
  post(Object.assign({type:"evento", sid:S.sid, etapa:etapa, pantalla:S.idx, ts:new Date().toISOString(), version:CONFIG.VERSION, utm_campaign:CTX.utm_campaign, utm_content:CTX.utm_content, utm_source:CTX.utm_source, movil:CTX.movil}, extra||{}));
}
function post(obj){
  if(PREVIEW){ if(window.console) console.log("[vista previa] envío", obj); return Promise.resolve(); }
  return fetch(CONFIG.ENDPOINT,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)});
}

var history_=[], lastShown=0;
function go(i, dir){
  var now=Date.now();
  var prev=SCREENS[S.idx];
  if(prev && S.t0){ S.tiempos[prev.key]=Math.round(((S.tiempos[prev.key]||0)*1000 + (now-lastShown))/100)/10; }
  S.idx=i; save();
  if(i>=SCREENS.length){ finish(); return; }
  render(i, dir);
}
function next(){
  var i=S.idx+1;
  // hitos del funnel
  if(SCREENS[i]){
    var q=SCREENS[i].q;
    if(q.id==="p6" && SCREENS[i].key==="p6"){ track("mitad"); toast("Vas por la mitad. Ahora, 2027."); }
    if(q.id==="genero"){ track("perfil"); toast("Últimas 4 y terminamos."); }
  }
  go(i,1);
}
function back(){ if(S.idx>0) go(S.idx-1,-1); }

}

function updateChrome(i){
  var hero=i===0;
  $("#top").hidden=hero; $("#meta").hidden=hero;
  var pct=Math.round(i/SCREENS.length*100);
  $("#barfill").style.width=pct+"%";
  $("#bar").setAttribute("aria-valuenow",pct);
  var s=SCREENS[i];
  var restante=(SCREENS.length-i)*CONFIG.SEG_POR_PANTALLA;
  $("#count").textContent="Pregunta "+s.qn+" de "+PREGUNTAS.length;
  $("#eta").textContent= restante<=60 ? "Falta menos de 1 minuto" : "Faltan ~"+Math.ceil(restante/60)+" min";
  $("#back").disabled = i===0;
}

  var sc=el("section",{"class":"screen"+(i===0?" hero":"")+(reduceMotion?"":" enter"),"aria-labelledby":"qtitle"});

  if(i===0) heroTop(sc);
  else sc.appendChild(el("p",{"class":"eyebrow",text:BLOQUES[q.b]+(s.card?" · "+(s.ci+1)+" de "+s.cn:"")}));

  var title = i===0 ? el("h1",{id:"qtitle",tabindex:"-1",text:q.t}) : el("h2",{id:"qtitle",tabindex:"-1",text:q.t});
  sc.appendChild(title);
  if(q.h) sc.appendChild(el("p",{"class":"hint",text:q.h}));
  if(s.card){
    var f=FOTOS[s.card[0]];
    sc.appendChild(el("figure",{"class":"person"},[ f?el("img",{"class":"portrait",src:f,alt:"Foto de "+s.card[1],width:"128",height:"128"}):null, el("figcaption",{text:s.card[1]}) ]));
  }
  if(q.fotos){
    sc.appendChild(el("div",{"class":"who"+(q.fotos.length>1?" pair":"")}, q.fotos.map(function(p){
      return el("figure",null,[el("img",{src:FOTOS[p[0]],alt:"Foto de "+p[1],width:"64",height:"64"}), el("figcaption",{text:p[1]})]);
    })));
  }

  if(q.place) renderPlace(sc,s);
  else renderOptions(sc,s);

  if(i===0) heroBottom(sc);
  app.appendChild(sc);

  $("#announce").textContent = i===0 ? "" : "Pregunta "+s.qn+" de "+PREGUNTAS.length+". "+(s.card? s.card[1] : "");
  if(i>0 || dir) setTimeout(function(){ title.focus({preventScroll:true}); window.scrollTo({top:0,behavior:reduceMotion?"auto":"smooth"}); },30);
}

function renderOptions(sc,s){
  var q=s.q, cur=S.a[s.key];
  var list = (S.orders[q.id] && !q.cards) ? S.orders[q.id] : q.o;
  var ul=el("div",{"class":"opts",role:"group","aria-labelledby":"qtitle"});
  var otroBox=null;
  function pick(label,btn){
    Array.prototype.forEach.call(sc.querySelectorAll(".opt"),function(b){b.setAttribute("aria-pressed","false");});
    btn.setAttribute("aria-pressed","true");
    S.a[s.key]=label; save();
    if(S.idx===0){ if(!S.t0){ S.t0=new Date().toISOString(); } track("inicio"); }
    if(q.otro && label===q.otro){ showOtro(); return; }
    if(otroBox){ otroBox.remove(); otroBox=null; delete S.a[s.key+"_otro"]; }
    setTimeout(next, reduceMotion?60:260);
  }
  function showOtro(){
    if(otroBox) return;
    var inp=el("input",{"class":"input",id:"otro_"+s.key,type:"text",maxlength:"80",autocomplete:"off",value:S.a[s.key+"_otro"]||""});
    var btn=el("button",{type:"button","class":"primary",text:"Siguiente"});
    btn.addEventListener("click",function(){ S.a[s.key+"_otro"]=inp.value.trim().slice(0,80); save(); next(); });
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); btn.click(); }});
    otroBox=el("div",{"class":"field"},[el("label",{"for":"otro_"+s.key,text:"¿Cuál? (opcional)"}),inp,btn]);
    ul.after(otroBox); inp.focus();
  }
  list.forEach(function(lbl){ ul.appendChild(optionButton(lbl, cur===lbl, pick, false, q.id)); });
  (q.tail||[]).forEach(function(lbl){ ul.appendChild(optionButton(lbl, cur===lbl, pick, false, q.id)); });
  if(q.otro) ul.appendChild(optionButton(q.otro, cur===q.otro, pick, false, q.id));
  if(q.dk || q.skip){ ul.appendChild(el("div",{"class":"sep","aria-hidden":"true"})); ul.appendChild(optionButton(q.dk||q.skip, cur===(q.dk||q.skip), pick, true)); }
  sc.appendChild(ul);
  if(q.otro && cur===q.otro) showOtro();
}

function renderPlace(sc,s){
  var cur=S.a.localidad ? {n:S.a.localidad, d:S.a.departamento} : null;
  var box=el("div",{"class":"combo"});
  var inp=el("input",{"class":"input",id:"loc",type:"search",role:"combobox","aria-autocomplete":"list","aria-expanded":"false","aria-controls":"loclist","aria-labelledby":"qtitle",autocomplete:"off",placeholder:"Ej.: Tilisarao",value:cur?cur.n:""});
  var ul=el("ul",{"class":"results",id:"loclist",role:"listbox","aria-label":"Localidades"});
  var chips=el("div",{"class":"chips","aria-label":"Las más elegidas"});
  POPULARES.forEach(function(n){
    var m=LOCALIDADES.filter(function(x){return x[0]===n;})[0]; if(!m) return;
    chips.appendChild(el("button",{type:"button","class":"chip",text:n,onclick:function(){choose(m);}}));
  });
  var active=-1, shown=[];
  var IDX=LOCALIDADES.map(function(x){return [norm(x[0]),x];});
  function choose(m){
    S.a.localidad=m[0]; S.a.departamento=m[1]; delete S.a.localidad_libre; save();
    inp.value=m[0]; ul.innerHTML=""; inp.setAttribute("aria-expanded","false");
    setTimeout(next, reduceMotion?60:200);
  }
  function draw(){
    var v=norm(inp.value); ul.innerHTML=""; active=-1;
    chips.hidden = v.length>0;
    if(!v){ inp.setAttribute("aria-expanded","false"); return; }
    var starts=[], has=[];
    IDX.forEach(function(r){ if(r[0].indexOf(v)===0 || r[0].indexOf(" "+v)>=0) starts.push(r[1]); else if(r[0].indexOf(v)>=0) has.push(r[1]); });
    shown=starts.concat(has).slice(0,8);
    shown.forEach(function(m,k){
      var li=el("li",{role:"option",id:"loc_o"+k,"aria-selected":"false"},[el("span",{text:m[0]}),el("small",{text:"Depto. "+m[1]})]);
      li.addEventListener("click",function(){choose(m);});
      ul.appendChild(li);
    });
    if(!shown.length) ul.appendChild(el("li",{"class":"empty",role:"option","aria-disabled":"true",text:"No la encontramos. Probá con otra forma de escribirla o usá el enlace de abajo."}));
    inp.setAttribute("aria-expanded","true");
  }
  inp.addEventListener("input",draw);
  inp.addEventListener("keydown",function(e){
    var items=ul.querySelectorAll("li[role=option]:not(.empty)");
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!items.length) return;
      active = (active + (e.key==="ArrowDown"?1:-1) + items.length) % items.length;
      Array.prototype.forEach.call(items,function(li,k){li.setAttribute("aria-selected",k===active?"true":"false");});
      inp.setAttribute("aria-activedescendant",items[active].id);
    } else if(e.key==="Enter"){ e.preventDefault(); if(active>=0 && shown[active]) choose(shown[active]); else if(shown.length===1) choose(shown[0]); }
  });
  box.appendChild(inp); box.appendChild(ul);
  sc.appendChild(box);
  sc.appendChild(chips);

  // alternativa manual
  var manual=el("button",{type:"button","class":"link",text:"Mi localidad no está en la lista"});
  manual.addEventListener("click",function(){
    manual.remove();
    var t=el("input",{"class":"input",id:"locfree",type:"text",maxlength:"60",autocomplete:"off"});
    var d=el("select",{"class":"input",id:"locdep"},[el("option",{value:"",text:"Elegí el departamento"})].concat(DEPTOS.map(function(x){return el("option",{value:x,text:x});})));
    var b=el("button",{type:"button","class":"primary",text:"Siguiente",disabled:"disabled"});
    function chk(){ b.disabled = !(t.value.trim().length>1 && d.value); }
    t.addEventListener("input",chk); d.addEventListener("change",chk);
    b.addEventListener("click",function(){ S.a.localidad="(otra)"; S.a.localidad_libre=t.value.trim().slice(0,60); S.a.departamento=d.value; save(); next(); });
    sc.appendChild(el("div",{"class":"field"},[el("label",{"for":"locfree",text:"Nombre de tu localidad o paraje"}),t]));
    sc.appendChild(el("div",{"class":"field"},[el("label",{"for":"locdep",text:"Departamento"}),d]));
    sc.appendChild(b); t.focus();
  });
  sc.appendChild(manual);
  if(!cur) setTimeout(function(){ inp.focus({preventScroll:true}); },60);
}

/* ---------- portada (P1 es el gancho) ---------- */
function heroTop(sc){
  sc.appendChild(el("div",{"class":"brand"},[
    el("span",{text:"Estudio de opinión independiente"}),
    el("button",{type:"button","class":"iconbtn",id:"bigger0","aria-pressed":document.documentElement.classList.contains("big")?"true":"false","aria-label":"Agrandar la letra",text:"A+",onclick:toggleBig})
  ]));
  sc.appendChild(el("div",{"class":"place"},[
    el("span",{"class":"map",html:'<svg viewBox="-3 -3 '+(MAPA_W+6)+' 206" aria-hidden="true" focusable="false"><path d="'+MAPA_D+'"/></svg>'}),
    el("div",{"class":"place-txt"},[
      el("p",{"class":"eyebrow",text:"Provincia de San Luis"}),
      el("p",{"class":"place-sub",text:"Contanos cómo ves la provincia."}),
      el("ul",{"class":"promise","aria-label":"Sobre esta encuesta"},[el("li",{text:"2 minutos"}),el("li",{text:"Anónima"}),el("li",{text:"Sin registro"})])
    ])
  ]));
  if(S._resume){
    var box=el("div",{"class":"resume"},[
      el("p",{text:"Ya habías empezado. ¿Seguís donde quedaste?"}),
      el("div",{"class":"row"},[
        el("button",{type:"button","class":"primary",text:"Seguir",onclick:function(){ var r=S._resume; delete S._resume; S.idx=r; render(r,1); }}),
        el("button",{type:"button","class":"link",text:"Empezar de nuevo",onclick:function(){ S=nuevoEstado(0); buildScreens(); save(); render(0); }})
      ])
    ]);
    sc.appendChild(box);
  }
}
function heroBottom(sc){
  sc.appendChild(el("p",{"class":"tap",text:"Tocá una opción para empezar."}));
  sc.appendChild(el("div",{"class":"hp","aria-hidden":"true"},[el("label",{"for":"website",text:"No completar"}), el("input",{id:"website",name:"website",type:"text",tabindex:"-1",autocomplete:"off"})]));
  var det=el("details",{"class":"privacy"},[
    el("summary",{text:"No te pedimos nombre, teléfono ni mail."}),
    el("p",{text:"Esta encuesta la realiza "+CONFIG.ESTUDIO+", de forma independiente. Las respuestas se analizan solo en conjunto, con fines estadísticos, y no se pueden vincular con vos. Podés dejarla cuando quieras."})
  ]);
  sc.appendChild(det);
  if(PREVIEW) sc.appendChild(el("p",{"class":"preview",text:"Vista previa: falta configurar el envío, así que las respuestas no se guardan."}));
}

function toggleBig(){
  var on=document.documentElement.classList.toggle("big");
  store("sl26_big",on?1:0);
  ["#bigger","#bigger0"].forEach(function(s){ var b=$(s); if(b) b.setAttribute("aria-pressed",on?"true":"false"); });
}

/* ---------- final ---------- */
function finish(){
  var hp=$("#website");
  var a=S.a;
  var payload={type:"respuesta", sid:S.sid, version:CONFIG.VERSION, ts_inicio:S.t0, ts_fin:new Date().toISOString(),
    dur_s: S.t0 ? Math.round((Date.now()-Date.parse(S.t0))/1000) : "", repetido:S.repetido, hp: (S.hp||""),
    orden_p5:(S.orders.p5||[]).join(">"), orden_p6:(S.orders.p6||[]).join(">"), tiempos:S.tiempos};
  PREGUNTAS.forEach(function(q){
    if(q.cards) q.cards.forEach(function(c){ payload[q.id+"_"+c[0]]=a[q.id+"_"+c[0]]||""; });
    else payload[q.id]=a[q.id]||"";
    if(q.otro) payload[q.id+"_otro"]=a[q.id+"_otro"]||"";
  });
  payload.departamento=a.departamento||""; payload.localidad_libre=a.localidad_libre||"";
  Object.assign(payload,CTX);
  store(KEY_PEND,payload);
  post(payload).then(function(){ store(KEY_PEND,null); }).catch(function(){});
  track("fin",{dur_s:payload.dur_s});
  store(KEY_DONE,{sid:S.sid,p1:a.p1,p2:a.p2});
  store(KEY,null);
  showDone({p1:a.p1,p2:a.p2}, true);
}

function showDone(mine, fresh){
  $("#top").hidden=true; $("#meta").hidden=true;
  var app=$("#app"); app.innerHTML="";
  var sc=el("section",{"class":"screen done"+(reduceMotion?"":" enter"),"aria-labelledby":"qtitle"});
  sc.appendChild(el("p",{"class":"eyebrow",text:fresh?"Encuesta completa":"Ya respondiste"}));
  sc.appendChild(el("h1",{id:"qtitle",tabindex:"-1",text: fresh?"¡Listo! Gracias por sumar tu opinión.":"Gracias, tu opinión ya está sumada."}));
  sc.appendChild(el("p",{"class":"hint",text:"Mientras más puntanos respondan, más fiel es la foto de la provincia."}));
  var res=el("div",{"class":"card",id:"resultados"},[el("h3",{text:"Qué piensan otros puntanos"}), el("p",{"class":"sub",text:"Cargando resultados…"})]);
  if(CONFIG.MOSTRAR_RESULTADOS) sc.appendChild(res);

  if(CONFIG.SORTEO_ACTIVO && !store(KEY_SORTEO)) sc.appendChild(sorteoBox());
  else if(store(KEY_SORTEO)) sc.appendChild(el("p",{"class":"note",text:"Ya estás participando del sorteo. ¡Suerte!"}));
  app.appendChild(sc);
  setTimeout(function(){ $("#qtitle").focus({preventScroll:true}); window.scrollTo(0,0); },30);
  if(fresh) confetti();
  if(CONFIG.MOSTRAR_RESULTADOS) loadResults(res, mine);
}
/* ---------- sorteo (opcional y separado de la encuesta) ---------- */
function sorteoBox(){
  var box=el("section",{"class":"card sorteo","aria-labelledby":"sorteo-t"});
  box.appendChild(el("h3",{id:"sorteo-t",text:"Participá del sorteo de "+CONFIG.SORTEO_PREMIO}));
  box.appendChild(el("p",{"class":"sub",text:"Es opcional. Si querés participar, dejanos un celular o un mail para avisarte si ganás."}));
  box.appendChild(el("p",{"class":"aviso",text:"Este dato se guarda aparte y no tiene ninguna relación con las respuestas que diste en la encuesta: no se pueden vincular entre sí."}));
  var inp=el("input",{"class":"input",id:"contacto",type:"text",inputmode:"email",autocomplete:"off",maxlength:"80",placeholder:"Ej.: 2664 123456 o nombre@mail.com","aria-describedby":"contacto-err"});
  var chk=el("input",{type:"checkbox",id:"acepto"});
  var basesTxt = CONFIG.SORTEO_BASES_URL ? el("a",{href:CONFIG.SORTEO_BASES_URL,target:"_blank",rel:"noopener",text:"las bases del sorteo"}) : "las bases del sorteo";
  var lab=el("label",{"for":"acepto","class":"check"},[chk, el("span",null,["Soy mayor de 18 años y acepto ",basesTxt,"."])]);
  var err=el("p",{"class":"err",id:"contacto-err",role:"alert"});
  var btn=el("button",{type:"button","class":"primary",text:"Quiero participar"});
  btn.addEventListener("click",function(){
    var v=inp.value.trim(), mail=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v), tel=v.replace(/\D/g,"").length>=8 && /^[\d\s()+-]+$/.test(v);
    if(!mail && !tel){ err.textContent="Escribí un celular (con característica) o un mail válido."; inp.focus(); return; }
    if(!chk.checked){ err.textContent="Para participar tenés que confirmar que sos mayor de 18 y aceptás las bases."; chk.focus(); return; }
    err.textContent="";
    // sin identificador de sesión, sin UTM y sin hora: no se puede cruzar con la encuesta
    post({type:"sorteo", contacto:v.slice(0,80), tipo: mail?"mail":"celular", fecha:new Date().toISOString().slice(0,10)});
    store(KEY_SORTEO,1);
    box.innerHTML="";
    box.appendChild(el("h3",{text:"¡Ya estás participando!"}));
    box.appendChild(el("p",{"class":"sub",text:"Si ganás, te vamos a contactar a ese "+(mail?"mail":"celular")+". Gracias otra vez."}));
  });
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); btn.click(); }});
  box.appendChild(el("div",{"class":"field"},[el("label",{"for":"contacto",text:"Celular o mail"}),inp]));
  box.appendChild(lab); box.appendChild(err); box.appendChild(btn);
  return box;
}

function loadResults(box, mine){
  var sub=box.querySelector(".sub");
  var demo={n:612, ejemplo:true, p1:{"Buen camino":281,"Mal camino":259,"No sé":72}, p2:[["Los sueldos no alcanzan",214],["Falta de trabajo",117],["Salud pública (hospitales, médicos, turnos)",88]]};
  var p = PREVIEW ? Promise.resolve(demo) : fetch(CONFIG.ENDPOINT+"?accion=resumen").then(function(r){return r.json();});
  p.then(function(d){
    if(!d || !d.n || d.n<CONFIG.MIN_N_RESULTADOS){ sub.textContent="Todavía estamos juntando respuestas. Volvé en unos días para ver los resultados."; return; }
    sub.textContent = (d.ejemplo?"Datos de ejemplo (vista previa) · ":"Resultados parciales, sin ponderar · ")+d.n.toLocaleString("es-AR")+" respuestas";
    var tot=0; for(var k in d.p1) tot+=d.p1[k];
    box.appendChild(el("p",{style:"margin:.25rem 0 0;font-weight:700",text:"¿San Luis va por buen camino?"}));
    ["Buen camino","Mal camino","No sé"].forEach(function(k){ box.appendChild(rbar(k, d.p1[k]||0, tot, mine&&mine.p1===k)); });
    if(d.p2 && d.p2.length){
      box.appendChild(el("p",{style:"margin:.5rem 0 0;font-weight:700",text:"Los 3 problemas más mencionados"}));
      d.p2.slice(0,3).forEach(function(r){ box.appendChild(rbar(r[0], r[1], d.p2_total||d.n, mine&&mine.p2===r[0])); });
    }
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ Array.prototype.forEach.call(box.querySelectorAll(".track i"),function(i){ i.style.width=i.dataset.w; }); }); });
  }).catch(function(){ sub.textContent="No pudimos cargar los resultados ahora. Tu respuesta sí quedó guardada."; });
}
function rbar(label,v,tot,isMine){
  var pct=tot?Math.round(v/tot*100):0;
  var lab=el("span",null,[label, isMine?el("span",{"class":"you",text:"Tu respuesta"}):null]);
  var tr=el("div",{"class":"track","aria-hidden":"true"},[el("i",{"data-w":pct+"%"})]);
  return el("div",{"class":"rbar"+(isMine?" mine":"")},[lab, el("b",{text:pct+"%"}), tr]);
}

function confetti(){
  if(reduceMotion) return;
  var c=$("#confetti"); c.hidden=false; var x=c.getContext("2d");
  var W=c.width=innerWidth*devicePixelRatio, H=c.height=innerHeight*devicePixelRatio;
  var css=getComputedStyle(document.documentElement);
  var cols=[css.getPropertyValue("--accent"),css.getPropertyValue("--warm"),css.getPropertyValue("--accent-soft")];
  var P=[]; for(var i=0;i<90;i++) P.push({x:W/2,y:H*0.35,vx:(Math.random()-.5)*W*0.018,vy:-Math.random()*H*0.016-H*0.004,r:(Math.random()*5+3)*devicePixelRatio,c:cols[i%3],a:Math.random()*6});
  var t0=performance.now();
  (function f(t){ var dt=t-t0; x.clearRect(0,0,W,H);
    P.forEach(function(p){ p.vy+=H*0.0006; p.x+=p.vx; p.y+=p.vy; p.a+=.15; x.fillStyle=p.c; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillRect(-p.r,-p.r/2,p.r*2,p.r); x.restore(); });
    if(dt<1800) requestAnimationFrame(f); else { x.clearRect(0,0,W,H); c.hidden=true; } })(t0);
}

/* ---------- arranque ---------- */
(function boot(){
  if(store("sl26_big")) document.documentElement.classList.add("big");
  $("#back").addEventListener("click",back);
  $("#bigger").addEventListener("click",toggleBig);
  $("#bigger").setAttribute("aria-pressed",document.documentElement.classList.contains("big")?"true":"false");
  document.addEventListener("input",function(e){ if(e.target && e.target.id==="website"){ S.hp="1"; save(); } });

  // reenviar una respuesta que no salió
  var pend=store(KEY_PEND); if(pend && !PREVIEW) post(pend).then(function(){ store(KEY_PEND,null); }).catch(function(){});

  var done=store(KEY_DONE);
  var prev=store(KEY);
  S = (prev && prev.sid && prev.orders) ? prev : nuevoEstado(0);
  buildScreens();
  if(done){ showDone(done,false); return; }
  if(prev && prev.idx>0 && prev.idx<SCREENS.length){ S._resume=S.idx; S.idx=0; render(0); return; }
  S.idx=0; save();
  render(0);
  track("vista");
})();
</script>
